name: Release

on:
  push:
    tags:
      - "v*"   # v1.0.0, v1.2.3-beta 등 모든 버전 태그에서 실행

jobs:
  release:
    runs-on: self-hosted
    permissions:
      contents: write   # GitHub Release 생성/업로드에 필요
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GoReleaser changelog 생성에 전체 히스토리 필요

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
