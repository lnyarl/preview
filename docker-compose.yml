services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    command: ["hub"]           # 데몬 실행 (마이그레이션 없이)
    ports:
      - "${HUB_PORT:-3000}:3000"
    environment:
      HUB_ADDR: ":3000"
      DATABASE_URL: "sqlite:///data/hub.db"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET 환경변수를 설정하세요}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin}"
      PREVIEW_BASE_DOMAIN: "${PREVIEW_BASE_DOMAIN:-localhost}"
      PREVIEW_REPO_URL: "${PREVIEW_REPO_URL:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - hub-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.hub
    command: ["hub", "migrate", "up"]
    environment:
      DATABASE_URL: "sqlite:///data/hub.db"
    volumes:
      - hub-data:/data
    # migrate 가 성공하면 종료 — hub 는 migrate 완료 후 시작
    depends_on: {}
    profiles: []              # migrate 는 hub 시작 전 자동 실행되지 않음

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command:
      - agent
      - start
      - --hub-url=ws://hub:3000/agent/ws
      - --token=${AGENT_TOKEN:?AGENT_TOKEN 환경변수를 설정하세요 (hub 에서 발급)}
      - --repo-url=${AGENT_REPO_URL:?AGENT_REPO_URL 환경변수를 설정하세요}
      - --advertise-host=${AGENT_ADVERTISE_HOST:-host.docker.internal}
      - --work-dir=/workspace
    environment:
      DOCKER_HOST: "${DOCKER_HOST:-unix:///var/run/docker.sock}"
    volumes:
      # 호스트 Docker 소켓 마운트 — Agent 가 호스트 Docker 데몬으로 컨테이너를 빌드/실행
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-workspace:/workspace
    depends_on:
      hub:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hub-data:
  agent-workspace:
