services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.hub
    command: ["hub", "migrate", "up"]
    environment:
      DATABASE_URL: "sqlite:///data/hub.db"
    volumes:
      - hub-data:/data

  hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    ports:
      - "${HUB_ADDR:-3000}:3000"
    environment:
      HUB_ADDR: ":3000"
      DATABASE_URL: "sqlite:///data/hub.db"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      PREVIEW_BASE_DOMAIN: "${PREVIEW_BASE_DOMAIN:-localhost}"
      PREVIEW_REPO_URL: "${PREVIEW_REPO_URL:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      RECONCILE_INTERVAL: "${RECONCILE_INTERVAL:-1m}"
      STALE_ASSIGNED_AFTER: "${STALE_ASSIGNED_AFTER:-5m}"
    volumes:
      - hub-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command:
      - agent
      - start
      - --hub-url=ws://hub:3000/agent/ws
      - --token=${HUB_TOKEN}
      - --repo-url=${AGENT_REPO_URL}
      - --advertise-host=${AGENT_ADVERTISE_HOST:-host.docker.internal}
      - --work-dir=${AGENT_WORK_DIR:-/workspace}
      - --prefetch-interval=${AGENT_PREFETCH_INTERVAL:-5m}
      - --max-jobs=${AGENT_MAX_JOBS:-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-workspace:/workspace
    depends_on:
      hub:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hub-data:
  agent-workspace:
