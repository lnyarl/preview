services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.hub
    command: ["migrate", "up"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "sqlite:///data/hub.db"
    volumes:
      - hub-data:/data

  hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    ports:
      - "${HUB_ADDR:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      HUB_ADDR: ":3000"
      DATABASE_URL: "sqlite:///data/hub.db"
      DEV_AGENT_TOKEN: "agt_dev-local-token-do-not-use-in-prod"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      BCRYPT_COST: "${BCRYPT_COST:-10}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
      PREVIEW_BASE_DOMAIN: "${PREVIEW_BASE_DOMAIN:-localhost}"
      AGENT_DOWNLOAD_URL: "${AGENT_DOWNLOAD_URL:-}"
      RECONCILE_INTERVAL: "${RECONCILE_INTERVAL:-1m}"
      STALE_ASSIGNED_AFTER: "${STALE_ASSIGNED_AFTER:-5m}"
    volumes:
      - hub-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    env_file:
      - path: .env
        required: false
    command:
      - start
      - --hub-url=ws://hub:3000/agent/ws
      - --token=agt_dev-local-token-do-not-use-in-prod
      - --advertise-host=${AGENT_ADVERTISE_HOST:-host.docker.internal}
      - --work-dir=/workspace
      - --prefetch-interval=${AGENT_PREFETCH_INTERVAL:-5m}
      - --max-jobs=${AGENT_MAX_JOBS:-1}
      - --github-token=${GITHUB_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-workspace:/workspace
    depends_on:
      hub:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hub-data:
  agent-workspace:
