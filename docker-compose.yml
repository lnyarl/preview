services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.hub
    command: ["migrate", "up"]
    env_file: .env
    environment:
      DATABASE_URL: "sqlite:///data/hub.db"   # 컨테이너 내부 경로 (볼륨 마운트)
    volumes:
      - hub-data:/data

  hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    ports:
      - "${HUB_ADDR:-3000}:3000"
    env_file: .env
    environment:
      HUB_ADDR: ":3000"                                      # 컨테이너 내부는 항상 3000
      DATABASE_URL: "sqlite:///data/hub.db"                  # 컨테이너 내부 경로
      DEV_AGENT_TOKEN: "agt_dev-local-token-do-not-use-in-prod"  # 고정 dev 토큰
    volumes:
      - hub-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    env_file: .env
    command:
      - start
      - --hub-url=ws://hub:3000/agent/ws
      - --token=agt_dev-local-token-do-not-use-in-prod
      - --advertise-host=${AGENT_ADVERTISE_HOST:-host.docker.internal}
      - --work-dir=/workspace
      - --prefetch-interval=${AGENT_PREFETCH_INTERVAL:-5m}
      - --max-jobs=${AGENT_MAX_JOBS:-1}
      - --github-token=${GITHUB_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-workspace:/workspace
    depends_on:
      hub:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hub-data:
  agent-workspace:
